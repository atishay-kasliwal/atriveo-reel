# Docker is provided for development and for Linux hosts.
#
# On macOS, containers run inside a Linux VM with no access to VideoToolbox,
# the Mac's hardware video encoder. A containerised worker there would fall
# back to software encoding and be several times slower, which is why the
# production deployment on the Mac Mini runs natively (see docs/DEPLOYMENT.md).
#
# On a Linux host this compose file runs the whole stack; set
# VIDEO_ENCODER=libx264 since VideoToolbox is macOS-only. That is the path the
# Oracle Cloud deployment takes — see docs/DEPLOYMENT-oracle.md, which also
# covers the arm64 and YouTube-bot-gate differences of running off-premises.
#
# The tunnel service is behind a profile so local runs don't publish anything:
#   docker compose up -d                      # web + worker only
#   docker compose --profile tunnel up -d     # ...plus the Cloudflare Tunnel

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start
    ports:
      # Bound to loopback: reach it through the tunnel, not the LAN.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      APP_PORT: 3000
      APP_HOSTNAME: 0.0.0.0
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DATA_DIR: /data
      VIDEO_ENCODER: ${VIDEO_ENCODER:-libx264}
      VIDEO_QUALITY: ${VIDEO_QUALITY:-20}
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
    volumes:
      - reels-data:/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run worker
    environment:
      DATA_DIR: /data
      VIDEO_ENCODER: ${VIDEO_ENCODER:-libx264}
      VIDEO_QUALITY: ${VIDEO_QUALITY:-20}
      MAX_CONCURRENT_RENDERS: ${MAX_CONCURRENT_RENDERS:-1}
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
    volumes:
      # Same volume as the web service: they share SQLite and the media files.
      - reels-data:/data
    restart: unless-stopped
    # No ports. The worker must never be reachable from outside.

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    # Config file rather than a --token: a tunnel created with `cloudflared
    # tunnel create` is locally managed, so its remote config is empty and a
    # token-run connector would register fine but 404 every request. Keeping
    # ingress here also means it is reviewable in the repository.
    # The image's default user cannot read a 0600 credentials file owned by
    # the host account. Running as that account keeps the secret unreadable to
    # everyone else rather than widening its permissions to suit the container.
    # Not hardcoded, because the account's id varies by image — Oracle's Ubuntu
    # numbers its default user 1001 where most images use 1000. `id -u`.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./scripts/cloudflared-oracle.yml:/etc/cloudflared/config.yml:ro
      # Not in the repository. See docs/DEPLOYMENT-oracle.md.
      - ./secrets/tunnel-credentials.json:/etc/cloudflared/creds.json:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  reels-data:
